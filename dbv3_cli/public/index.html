<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawingBotV3 Engine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <h1 class="logo">DrawingBot<span>V3</span></h1>
            
            <div class="control-group">
                <label for="image-upload" class="upload-btn">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    Upload Image
                </label>
                <input type="file" id="image-upload" accept="image/png, image/jpeg" style="display:none;">
                <p id="file-name" class="file-name">No image selected</p>
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-setup">Setup</button>
                <button class="tab-btn" data-tab="tab-filters">Filters</button>
                <button class="tab-btn" data-tab="tab-pens">Pens</button>
                <button class="tab-btn" data-tab="tab-algo">Algorithm</button>
                <button class="tab-btn" data-tab="tab-export">Export</button>
            </div>

            <!-- SETUP TAB -->
            <div id="tab-setup" class="tab-content active">
                <div class="control-group">
                    <label>Drawing Width (mm)</label>
                    <input type="number" id="setup-width" value="210.0" step="1">
                </div>
                <div class="control-group">
                    <label>Drawing Height (mm)</label>
                    <input type="number" id="setup-height" value="297.0" step="1">
                </div>
                <div class="control-group">
                    <label>Scaling Mode</label>
                    <select id="setup-scaling">
                        <option value="scale_to_fit">Scale to Fit</option>
                        <option value="crop_to_fit">Crop to Fit</option>
                        <option value="stretch_to_fit">Stretch to Fit</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Background Color</label>
                    <input type="color" id="setup-bg" value="#FFFFFF">
                </div>
            </div>

            <!-- FILTERS TAB -->
            <div id="tab-filters" class="tab-content">
                <p style="font-size: 12px; color: var(--text-muted);">Active Filters (Applied in order):</p>
                <div id="active-filters-list"></div>
                
                <div class="control-group" style="margin-top: 10px;">
                    <select id="filter-select">
                        <option value="GrayscaleFilter">Grayscale</option>
                        <option value="BlurFilter">Blur (Gaussian)</option>
                        <option value="EdgeDetectionFilter">Edge Detection (Sobel)</option>
                        <option value="InvertFilter">Invert Colors</option>
                        <option value="BrightnessContrastFilter">Brightness/Contrast</option>
                    </select>
                    <button id="add-filter-btn" class="secondary-btn" style="padding: 8px;">+ Add Filter</button>
                </div>
            </div>

            <!-- PENS TAB -->
            <div id="tab-pens" class="tab-content">
                <div class="control-group">
                    <label>Color Separation</label>
                    <select id="pens-separation">
                        <option value="Grayscale">Grayscale (1 Channel)</option>
                        <option value="CMYK">CMYK (4 Channels)</option>
                        <option value="CMYK_EXTENDED">CMYK Extended (8 Channels)</option>
                        <option value="Colour Match">Colour Match</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Distribution Type</label>
                    <select id="pens-distribution">
                        <option value="even_weighted">Even Weighted</option>
                        <option value="luminance_weighted">Luminance Weighted</option>
                        <option value="random_weighted">Random Weighted</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Pen List</label>
                    <div id="pen-list">
                        <!-- Dynamic Pens go here -->
                    </div>
                    <button id="add-pen-btn" class="secondary-btn" style="margin-top: 10px; padding: 8px;">+ Add Pen</button>
                </div>
            </div>

            <!-- ALGORITHM TAB -->
            <div id="tab-algo" class="tab-content">
                <div class="control-group">
                    <label>Algorithm</label>
                    <select id="algorithm-select">
                        <!-- Populated dynamically by app.js -->
                    </select>
                </div>

                <div id="dynamic-controls" class="dynamic-controls">
                    <!-- Sliders populated dynamically by app.js -->
                </div>

                <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
                <div class="control-group checkbox-group">
                    <label><input type="checkbox" id="opt-simplify" checked> Simplify Paths</label>
                    <label><input type="checkbox" id="opt-merge" checked> Merge Paths</label>
                    <label><input type="checkbox" id="opt-sort" checked> Sort Paths</label>
                </div>
            </div>

            <!-- EXPORT TAB -->
            <div id="tab-export" class="tab-content">
                <div class="control-group">
                    <label>G-Code Offset X</label>
                    <input type="number" id="export-offsetx" value="0.0" step="1">
                </div>
                <div class="control-group">
                    <label>G-Code Offset Y</label>
                    <input type="number" id="export-offsety" value="0.0" step="1">
                </div>
                <div class="control-group">
                    <label>Curve Flatness</label>
                    <input type="number" id="export-flatness" value="0.1" step="0.1">
                </div>
            </div>

            <button id="generate-btn" class="generate-btn" disabled>Generate Vector</button>
        </aside>

        <!-- Main Preview Area -->
        <main class="preview-area">
            <div class="canvas-container">
                <img id="preview-image" src="" alt="Preview" style="display:none;">
                <div id="loader" class="loader" style="display:none;">
                    <div class="spinner"></div>
                    <div id="progressContainer" style="width: 100%; max-width: 300px; height: 10px; background: #333; margin-top: 20px; border-radius: 5px; overflow: hidden; display: none;">
                        <div id="progressBar" style="width: 0%; height: 100%; background: #4a90e2; transition: width 0.2s ease;"></div>
                    </div>
                    <div id="progressText" style="margin-top: 10px; font-size: 14px; color: #aaa; display: none;">Preparing...</div>
                </div>
                <div id="placeholder" class="placeholder">
                    <h2>Ready to vectorize</h2>
                    <p>Upload an image and click Generate.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="schema.js"></script>
    <script src="app.js"></script>
</body>
</html>
